[package]
name = "ljos-mcp"
version.workspace = true
# The `ljos` crate ships this binary; this package is the workspace's
# development shape of it and is not published.
publish = false
readme = "../../README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MCP server for ljos"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/ljos-v{ version }-{ target }.tar.gz"
bin-dir = "ljos-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[[bin]]
name = "ljos-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
ljos = { path = "../ljos-cli", version = "0.14.1" }
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
which.workspace = true

[dev-dependencies]
tempfile = "3"
