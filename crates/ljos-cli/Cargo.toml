[package]
name = "ljos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Write one claim, search it back. Standing memory for an agent seat."
readme = "../../README.md"
keywords = ["mcp", "memory", "agents", "cli"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/ljos-v{ version }-{ target }.tar.gz"
bin-dir = "ljos-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
# cargo-quickinstall only ships `ljos`. The GitHub tarball has ljos-mcp too.
disabled-strategies = ["quick-install", "compile"]

[lib]
name = "ljos_cli"
path = "src/lib.rs"

[[bin]]
name = "ljos"
path = "src/main.rs"

[[bin]]
name = "ljos-mcp"
path = "../ljos-mcp/src/main.rs"

[dependencies]
libc = "0.2"
anyhow.workspace = true
clap.workspace = true
packset-client.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
which.workspace = true
vissue-core.workspace = true
rmcp.workspace = true
schemars.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile = "3"
