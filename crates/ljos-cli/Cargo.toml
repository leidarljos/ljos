[package]
name = "ljos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "ljos: one seat over the five habitats and policyd"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/ljos-v{ version }-{ target }.tar.gz"
bin-dir = "ljos-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[lib]
name = "ljos_cli"
path = "src/lib.rs"

[[bin]]
name = "ljos"
path = "src/main.rs"

[dependencies]
libc = "0.2"
anyhow.workspace = true
clap.workspace = true
packset-client.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
which.workspace = true
