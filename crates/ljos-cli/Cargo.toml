[package]
name = "ljos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Memory, a work tracker and a shell-command gate for coding agents (Claude Code, Codex, Grok Build, agy, opencode) over MCP and hooks."
readme = "../../README.md"
keywords = ["mcp", "agent-memory", "claude-code", "codex", "ai-agents"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/ljos-v{ version }-{ target }.tar.gz"
bin-dir = "ljos-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
# cargo-quickinstall only ships `ljos`. The GitHub tarball has ljos-mcp too.
# Without a tarball for the target, binstall builds from source, which
# installs both binaries.
disabled-strategies = ["quick-install"]

[lib]
name = "ljos_cli"
path = "src/lib.rs"

[[bin]]
name = "ljos"
path = "src/main.rs"

[[bin]]
name = "ljos-mcp"
path = "src/bin/ljos-mcp/main.rs"

[dependencies]
libc = "0.2"
regex-automata = "0.4"
chrono = "0.4"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
anyhow.workspace = true
clap.workspace = true
packset-client.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
which.workspace = true
vissue-core.workspace = true
rmcp.workspace = true
schemars.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile = "3"
