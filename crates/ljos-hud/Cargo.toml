[package]
name = "ljos-hud"
description = "Read-only icedtea pane over due reviews, live claims, and the trust graph."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"

# iced links native graphics stacks. Dist the HUD on gnu/darwin only; musl archives are the CLI.
[package.metadata.dist]
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

[lib]
name = "ljos_hud"
path = "src/lib.rs"

[[bin]]
name = "ljos-hud"
path = "src/bin.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
ljos = { path = "../ljos-cli", version = "0.17.0" }
claimdag = "0.6.2"
iced = { version = "0.14", default-features = true, features = [
    "tokio",
    "advanced",
    "lazy",
] }
# 0.17.0: checkbox is CheckState, label takes LabelFace. Do not fork iced.
icedtea = "0.17.0"
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
tempfile = "3"

# StatusNotifier tray on Linux: left click toggles, Quit leaves the HUD only.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"
wayland-backend = { version = "0.3.16", features = ["client_system"] }
wayland-client = { version = "0.31.15", features = ["system"] }
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
