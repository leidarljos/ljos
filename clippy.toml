disallowed-macros = [
    { path = "std::print", reason = "print through tell! or emit!, which take the stdout width" },
    { path = "std::println", reason = "print through tell! or emit!, which take the stdout width" },
    { path = "std::eprint", reason = "print through say!, which wraps to the stderr width" },
    { path = "std::eprintln", reason = "print through say!, which wraps to the stderr width" },
    { path = "std::dbg", reason = "dbg! writes to stderr unwrapped" },
]
disallowed-methods = [
    { path = "std::io::stdout", reason = "write stdout through tell! or emit!" },
    { path = "std::io::stderr", reason = "write stderr through say!" },
    { path = "std::io::Stdout::lock", reason = "write stdout through tell! or emit!" },
    { path = "std::io::Stderr::lock", reason = "write stderr through say!" },
    { path = "std::os::fd::FromRawFd::from_raw_fd", reason = "route terminal output through output.rs" },
    { path = "std::os::unix::io::FromRawFd::from_raw_fd", reason = "route terminal output through output.rs" },
    { path = "libc::write", reason = "route terminal output through output.rs" },
    { path = "rustix::io::write", reason = "route terminal output through output.rs" },
    { path = "libc::writev", reason = "route terminal output through output.rs" },
    { path = "rustix::io::writev", reason = "route terminal output through output.rs" },
    # Calls that put a file at a path or start a program. Code that names a
    # git hook denies `clippy::disallowed_methods`, so a hook there is
    # published only through `install_executable`, `install_executable_mode`
    # or `copy_executable`, its other files are written with `write_file`,
    # and its programs start through `program`. The lint is allowed
    # elsewhere through `[workspace.lints]` in Cargo.toml.
    { path = "std::fs::write", reason = "use ljos_cli::write_file, or install_executable for a hook" },
    { path = "std::fs::copy", reason = "use ljos_cli::copy_executable" },
    { path = "std::fs::rename", reason = "use ljos_cli::install_executable" },
    { path = "std::fs::hard_link", reason = "use ljos_cli::install_executable" },
    { path = "std::fs::soft_link", reason = "use ljos_cli::install_executable" },
    { path = "std::fs::set_permissions", reason = "use install_executable_mode, or set_permissions on an open File" },
    { path = "std::os::unix::fs::symlink", reason = "use ljos_cli::install_executable" },
    { path = "std::fs::File::create", reason = "use ljos_cli::write_file, or install_executable for a hook" },
    { path = "std::fs::File::create_new", reason = "use ljos_cli::write_file, or install_executable for a hook" },
    { path = "std::fs::OpenOptions::open", reason = "use File::open to read, ljos_cli::write_file to write" },
    { path = "std::process::Command::new", reason = "use ljos_cli::program, which refuses cp, mv, install and ln" },
    { path = "tempfile::NamedTempFile::persist", reason = "use ljos_cli::install_executable", allow-invalid = true },
    { path = "tempfile::TempPath::persist", reason = "use ljos_cli::install_executable", allow-invalid = true },
    { path = "libc::open", reason = "use ljos_cli::install_executable" },
    { path = "libc::openat", reason = "use ljos_cli::install_executable" },
    { path = "libc::creat", reason = "use ljos_cli::install_executable" },
    { path = "libc::rename", reason = "use ljos_cli::install_executable" },
    { path = "libc::renameat", reason = "use ljos_cli::install_executable" },
    { path = "libc::link", reason = "use ljos_cli::install_executable" },
    { path = "libc::linkat", reason = "use ljos_cli::install_executable" },
    { path = "libc::symlink", reason = "use ljos_cli::install_executable" },
    { path = "libc::symlinkat", reason = "use ljos_cli::install_executable" },
    { path = "libc::syscall", reason = "use ljos_cli::install_executable" },
    { path = "libc::open64", reason = "use ljos_cli::install_executable", allow-invalid = true },
    { path = "libc::openat64", reason = "use ljos_cli::install_executable", allow-invalid = true },
    { path = "libc::creat64", reason = "use ljos_cli::install_executable", allow-invalid = true },
    { path = "libc::renameat2", reason = "use ljos_cli::install_executable", allow-invalid = true },
    { path = "libc::renamex_np", reason = "use ljos_cli::install_executable", allow-invalid = true },
    { path = "libc::renameatx_np", reason = "use ljos_cli::install_executable", allow-invalid = true },
]
