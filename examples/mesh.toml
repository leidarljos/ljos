# The policy `ljos mesh acl` prints. `ljos mesh up` and `ljos mesh down` do
# not read this file: the join key, the login server and the hostname come
# from flags. Copy it to $XDG_CONFIG_HOME/ljos/mesh.toml, or
# ~/.config/ljos/mesh.toml when XDG_CONFIG_HOME is unset.
# Every box port the policy names is written here and nowhere else.

# Not read by `mesh up`. Kept so a file from an earlier mesh still parses.
# example.org is a name reserved for documentation (RFC 2606).
login_server = "https://headscale.example.org"

# Not read by `mesh up`. The join key is `--key-file` or `LJOS_MESH_KEY_FILE`,
# and it never goes in this file.
key_env = "LJOS_MESH_AUTHKEY"

# The swarm `ljos mesh acl` writes rules for. Its tag is tag:swarm-<swarm>.
# Lowercase letters, digits and inner dashes, at most 53 characters, so a
# node name built from it stays one DNS label (RFC 1035).
swarm = "example"

[ports]
# The four services on the box, each by the port it listens on. These values
# are placeholders: set your own. `ljos mesh acl` opens these four ports to
# each swarm, and no other port on the box.
api = 8400
store-ro = 8401
docs-ro = 8402
drop = 8403

# Not a box port, and the policy does not name it. `mesh up` uses 1055 on
# its own when it has no TUN device: the port tailscale's userspace
# networking guide uses. Kept so a file from an earlier mesh still parses.
socks = 1055
