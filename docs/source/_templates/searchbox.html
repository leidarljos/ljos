{%- if pathto('search') != '#' -%}
<form class="searchbox flex items-center" action="{{ pathto('search') }}" method="get" role="search">
  <label for="ll-search-q" class="ll-sr">{{ _('Search') }}</label>
  <input id="ll-search-q" type="text" name="q" placeholder="{{ _('Search') }}" aria-label="{{ _('Search') }}" />
  <kbd>/</kbd>
</form>
{%- endif -%}
