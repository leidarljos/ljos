{%- extends "basic/search.html" %}

{% block searchbox %}
  <form class="searchform" action="" method="get" role="search">
    <label for="ll-search-page-q" class="ll-sr">{{ _('Search') }}</label>
    <input id="ll-search-page-q" type="text" name="q" aria-label="{{ _('Search') }}" aria-labelledby="search-documentation" value="" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>
    <button type="submit">{{ _('search') }}</button>
  </form>
  <p><span id="search-progress"></span></p>
{% endblock %}
