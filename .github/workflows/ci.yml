name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

# A group holds one running and one pending run, and a newer pending run
# cancels the older one even with cancel-in-progress off. So each develop
# and main push has a group of its own, keyed by its sha, and runs to the
# end. Any other branch keeps one group, where a new push cancels the last.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && github.sha || 'tip' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

jobs:
  workflows:
    name: workflow files
    # The resolute runner cannot resolve the Ubuntu archive.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/check-workflows.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Cargo.toml's [workspace.package] version is the only one written by
      # hand. Every copy cogfiles.txt lists, and the JSON manifests, follow it.
      - name: Version copies
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q 'cogapp==3.6.0'
          cog -I scripts --check --diff --check-fail-msg='run python3 scripts/ljos_version.py' @cogfiles.txt
  # Draft the fragments at the workspace version, the only one written
  # by hand. towncrier 26.9.0 fails an unparsable fragment name when
  # `ignore` is set, and fails two files that parse as the same issue
  # and type. Draft writes nothing.
  changelog:
    name: changelog fragments
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Draft the changelog
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q 'towncrier==26.9.0'
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          towncrier build --draft --version "$version"
  # A push is before..sha. A new branch's before is all zeros, so the
  # commits are the ones on no other remote branch. A pull request is
  # base..head. Commits already on the base are outside the range.
  identity:
    name: commit identity
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Test the identity gate
        run: scripts/identity-gate-test.sh
      - name: Check commits new to this event
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          EVENT_NAME=${EVENT_NAME-}
          BEFORE=${BEFORE-}
          SHA=${SHA-}
          PR_BASE=${PR_BASE-}
          PR_HEAD=${PR_HEAD-}
          REF_NAME=${REF_NAME-}
          zero=0000000000000000000000000000000000000000
          if [ "$SHA" = "$zero" ]; then
            echo "identity-gate: ref deletion has no commits to judge" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -z "$PR_BASE" ] || [ -z "$PR_HEAD" ]; then
              echo "identity-gate: missing pull request range" >&2
              exit 1
            fi
            scripts/identity-gate.sh "$PR_BASE..$PR_HEAD"
          elif [ "$BEFORE" = "$zero" ]; then
            if [ -z "$REF_NAME" ]; then
              echo "identity-gate: missing ref name" >&2
              exit 1
            fi
            git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
            scripts/identity-gate.sh "$SHA" --not \
              --exclude="origin/${REF_NAME}" \
              --exclude="origin/HEAD" \
              --remotes=origin
          elif [ -n "$BEFORE" ]; then
            scripts/identity-gate.sh "$BEFORE..$SHA"
          else
            echo "identity-gate: missing before" >&2
            exit 1
          fi
  test:
    name: cargo test
    # CPU runner. The packset binary is built on its own; packset-embed is not.
    runs-on: ubuntu-24.04
    # Line tables keep file:line backtraces and drop the full DWARF that
    # filled the disk while linking test binaries (runs 41463392955 and
    # 41475421230).
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The image's .NET, Android, GHC and CodeQL toolchains; nothing here uses them.
      - name: Free disk
        run: |
          set -eu
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.89.0
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Mail reader tests build a notmuch database. Detach tests need tmux.
      # The identity gate tests start a one-shot runner under zsh -c.
      # The hook queue test reads each call's peak RSS from GNU time.
      - name: Install age, tmux, notmuch and time
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends age tmux notmuch time zsh
      # vissue, claimdag and deedar are named in .github/sibling-pin.
      # packset, phronesis and ljos-policyd are named in
      # scripts/sibling-tools.sh. The script builds each pin, checks the
      # version line and installs into one directory. A local run uses
      # the same script. The binaries depend only on the pin file and the
      # script, so a later run with the same two reuses them. A substring
      # of a version matches a different release, so the script compares
      # the whole first line.
      - name: Cache pinned sibling tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/sibling-bin
          key: sibling-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/sibling-pin', 'scripts/sibling-tools.sh') }}
      - name: Build pinned sibling tools
        run: |
          set -euo pipefail
          # phronesis's c-capnproto wrap is C++. The runner image has g++;
          # install it with the other packages so this step asks for the
          # same set CONTRIBUTING names.
          sudo apt-get install -y --no-install-recommends g++ meson ninja-build capnproto pkg-config
          scripts/sibling-tools.sh "${{ runner.temp }}/sibling-bin"
          echo "${{ runner.temp }}/sibling-bin" >> "$GITHUB_PATH"
          export PATH="${{ runner.temp }}/sibling-bin:${PATH}"
          command -v age-keygen
      - name: Sourcing sibling-tools puts the pins on PATH
        run: bash scripts/sibling-source-check.sh "${{ runner.temp }}/sibling-bin"
      # A test that runs git in this checkout writes its .git/config, and
      # the next commit here runs hooks from a temp home that is gone.
      # Without --no-fail-fast one failing lib test stopped cargo before
      # any tests/*.rs ran (run 41565021207).
      - name: Workspace tests
        run: |
          set -euo pipefail
          git config --local --list > "${{ runner.temp }}/git-config-before"
          cargo test --workspace --no-fail-fast
          git config --local --list > "${{ runner.temp }}/git-config-after"
          diff -u "${{ runner.temp }}/git-config-before" "${{ runner.temp }}/git-config-after"
      - name: MCP tool list size
        run: |
          set -euo pipefail
          python3 -m venv "${{ runner.temp }}/tok"
          "${{ runner.temp }}/tok/bin/pip" install --disable-pip-version-check 'tiktoken==0.12.0'
          PATH="${{ runner.temp }}/tok/bin:${PATH}" scripts/mcp-size.sh --check
      # The samples in the docs are this binary's doctor, version and help.
      # A committed block that was typed by hand, or that a command no longer
      # prints, fails the diff.
      - name: Doc samples
        run: |
          set -euo pipefail
          python3 docs/scripts/gen_samples.py
          git diff --exit-code

  # A push that passed the tests keeps a bookworm build for fourteen days.
  # The cargo line is the linux line from release.yml. Debian 12 is the
  # glibc baseline, so the binaries run where that release runs. Nothing
  # here tags a commit or publishes a release.
  linux-archive:
    name: linux archive
    needs: test
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the bookworm archive
        run: docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src debian:bookworm bash /src/scripts/bookworm-archive.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ljos-${{ github.sha }}-x86_64-linux
          path: |
            dist/ljos-${{ github.sha }}-x86_64-linux.tar.gz
            dist/ljos-${{ github.sha }}-x86_64-linux.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error

  macos:
    name: cargo check and test on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.89.0
          targets: aarch64-apple-darwin, x86_64-apple-darwin
          components: clippy
      # The pin in rust-toolchain.toml is the compiler cargo runs.
      # Targets on the action's toolchain do not reach that pin.
      - name: The pinned cross target
        run: |
          set -eu
          rustup target add x86_64-apple-darwin
          rustup target list --installed | grep -qx x86_64-apple-darwin
      - name: Check aarch64-apple-darwin
        run: cargo check --locked --workspace --all-targets --target aarch64-apple-darwin
      - name: Check x86_64-apple-darwin
        run: cargo check --locked --workspace --all-targets --target x86_64-apple-darwin
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The sync, rules and push tests seal with age, as on the Linux job.
      - name: age
        run: |
          set -eu
          brew install age
          command -v age-keygen
      - name: Unit tests
        run: cargo test --locked --workspace --lib --no-fail-fast

  # release.yml already builds on macos-latest. This job runs the
  # parent-death and launcher tests there, which is the kqueue path.
  # Those tests use a fake pack and do not need packsetd.
  mcp-lifetime-macos:
    name: mcp lifetime on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.89.0
      - name: MCP lifetime
        run: cargo test -p ljos --test mcp_lifetime --no-fail-fast

  deny:
    name: cargo deny check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.89.0
      # Built from source, so the job pulls no image from Docker Hub.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: deny
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}-${{ runner.arch }}
      - name: Build cargo-deny 0.20.2 from source
        if: steps.deny.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: cargo deny check
        run: cargo deny check
