name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test
    # CPU runner. The packset binary is built on its own; packset-embed is not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends age
      - name: Build packset from develop
        run: |
          set -euo pipefail
          git clone --depth 1 --branch develop https://github.com/leidarljos/packset.git "${{ runner.temp }}/packset"
          cargo build --locked --manifest-path "${{ runner.temp }}/packset/Cargo.toml" -p packset --bin packset
          mkdir -p "${{ runner.temp }}/bin"
          install -m 0755 "${{ runner.temp }}/packset/target/debug/packset" "${{ runner.temp }}/bin/packset"
          echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"
          export PATH="${{ runner.temp }}/bin:${PATH}"
          command -v age-keygen
          command -v packset
      - name: Workspace tests
        run: cargo test --workspace
