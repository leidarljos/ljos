name: CI

on:
  push:
    branches: [develop, main, l0-admission-20261020]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: workflow files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/check-workflows.py
  test:
    name: cargo test
    # CPU runner. The packset binary is built on its own; packset-embed is not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends age
      - name: Build packset from develop
        run: |
          set -euo pipefail
          git clone --depth 1 --branch develop https://github.com/leidarljos/packset.git "${{ runner.temp }}/packset"
          cargo build --locked --manifest-path "${{ runner.temp }}/packset/Cargo.toml" -p packset --bin packset --bin packsetd
          mkdir -p "${{ runner.temp }}/bin"
          install -m 0755 "${{ runner.temp }}/packset/target/debug/packset" "${{ runner.temp }}/bin/packset"
          install -m 0755 "${{ runner.temp }}/packset/target/debug/packsetd" "${{ runner.temp }}/bin/packsetd"
          echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"
          export PATH="${{ runner.temp }}/bin:${PATH}"
          command -v age-keygen
          command -v packset
          command -v packsetd
      - name: Workspace tests
        run: cargo test --workspace

  # A push that passed the tests keeps a bookworm build for fourteen days.
  # The cargo line is the linux line from release.yml. Debian 12 is the
  # glibc baseline, so the binaries run where that release runs. Nothing
  # here tags a commit or publishes a release.
  linux-archive:
    name: linux archive
    needs: test
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the bookworm archive
        run: docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src debian:bookworm bash /src/scripts/bookworm-archive.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ljos-${{ github.sha }}-x86_64-linux
          path: |
            dist/ljos-${{ github.sha }}-x86_64-linux.tar.gz
            dist/ljos-${{ github.sha }}-x86_64-linux.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error

  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.89.0
      # Built from source, so the job pulls no image from Docker Hub.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: deny
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}-${{ runner.arch }}
      - name: Build cargo-deny 0.20.2 from source
        if: steps.deny.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: cargo deny check
        run: cargo deny check
