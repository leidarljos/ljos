name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

jobs:
  workflows:
    name: workflow files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/check-workflows.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Cargo.toml's [workspace.package] version is the only one written by
      # hand. Every copy cogfiles.txt lists, and the JSON manifests, follow it.
      - name: Version copies
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q 'cogapp==3.6.0'
          cog -I scripts --check --diff --check-fail-msg='run python3 scripts/ljos_version.py' @cogfiles.txt
  # Draft the fragments at the workspace version, the only one written
  # by hand. towncrier 26.9.0 fails an unparsable fragment name when
  # `ignore` is set, and fails two files that parse as the same issue
  # and type. Draft writes nothing.
  changelog:
    name: changelog fragments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Draft the changelog
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q 'towncrier==26.9.0'
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          towncrier build --draft --version "$version"
  # A push is before..sha. A new branch's before is all zeros, so the
  # commits are the ones on no other remote branch. A pull request is
  # base..head. Commits already on the base are outside the range.
  identity:
    name: commit identity
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Test the identity gate
        run: scripts/identity-gate-test.sh
      - name: Check commits new to this event
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          EVENT_NAME=${EVENT_NAME-}
          BEFORE=${BEFORE-}
          SHA=${SHA-}
          PR_BASE=${PR_BASE-}
          PR_HEAD=${PR_HEAD-}
          REF_NAME=${REF_NAME-}
          zero=0000000000000000000000000000000000000000
          if [ "$SHA" = "$zero" ]; then
            echo "identity-gate: ref deletion has no commits to judge" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -z "$PR_BASE" ] || [ -z "$PR_HEAD" ]; then
              echo "identity-gate: missing pull request range" >&2
              exit 1
            fi
            scripts/identity-gate.sh "$PR_BASE..$PR_HEAD"
          elif [ "$BEFORE" = "$zero" ]; then
            if [ -z "$REF_NAME" ]; then
              echo "identity-gate: missing ref name" >&2
              exit 1
            fi
            git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
            scripts/identity-gate.sh "$SHA" --not \
              --exclude="origin/${REF_NAME}" \
              --exclude="origin/HEAD" \
              --remotes=origin
          elif [ -n "$BEFORE" ]; then
            scripts/identity-gate.sh "$BEFORE..$SHA"
          else
            echo "identity-gate: missing before" >&2
            exit 1
          fi
  test:
    name: cargo test
    # CPU runner. The packset binary is built on its own; packset-embed is not.
    runs-on: ubuntu-latest
    # Line tables keep file:line backtraces and drop the full DWARF that
    # filled the disk while linking test binaries (runs 41463392955 and
    # 41475421230).
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The image's .NET, Android, GHC and CodeQL toolchains; nothing here uses them.
      - name: Free disk
        run: |
          set -eu
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --keep-going -- -D warnings
      # Mail reader tests build a notmuch database. Detach tests need tmux.
      # The identity gate tests start a one-shot runner under zsh -c.
      # The hook queue test reads each call's peak RSS from GNU time.
      - name: Install age, tmux, notmuch and time
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends age tmux notmuch time zsh
      - name: Build packset at the pinned commit
        run: |
          set -euo pipefail
          sha=0fed66408b081a1749befac682304d92e7b29586
          dir="${{ runner.temp }}/packset"
          git init -q "$dir"
          git -C "$dir" remote add origin https://github.com/leidarljos/packset.git
          git -C "$dir" fetch --depth 1 origin "$sha"
          git -C "$dir" checkout --detach FETCH_HEAD
          test "$(git -C "$dir" rev-parse HEAD)" = "$sha"
          cargo build --locked --manifest-path "$dir/Cargo.toml" -p packset --bin packset --bin packsetd
          mkdir -p "${{ runner.temp }}/bin"
          install -m 0755 "$dir/target/debug/packset" "${{ runner.temp }}/bin/packset"
          install -m 0755 "$dir/target/debug/packsetd" "${{ runner.temp }}/bin/packsetd"
          echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"
          export PATH="${{ runner.temp }}/bin:${PATH}"
          command -v age-keygen
          command -v packset
          command -v packsetd
      # vissue, claimdag and deedar are the sibling tools the tracker
      # tests run. .github/sibling-pin names each by repository, full
      # commit and the version `NAME --version` prints. A tag moves, so
      # the commit is what is built. The binaries depend only on that
      # file, so a later run with the same pin reuses them. A substring
      # of the version (`grep 0.20`) matches a different release, so the
      # check is the whole first line.
      - name: Cache pinned vissue, claimdag and deedar
        id: siblings
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/sibling-bin
          key: sibling-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/sibling-pin') }}
      - name: Build vissue, claimdag and deedar at the pinned commits
        if: steps.siblings.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          dest="${{ runner.temp }}/sibling-bin"
          mkdir -p "$dest"
          line_no=0
          while IFS= read -r line || [ -n "$line" ]; do
            line_no=$((line_no + 1))
            trim=$(printf '%s' "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            case "$trim" in
              ''|\#*) continue ;;
            esac
            set -- $trim
            if [ "$#" -ne 4 ]; then
              echo "sibling-pin:${line_no}: want name repository commit version" >&2
              exit 1
            fi
            name=$1
            repo=$2
            commit=$3
            case "$repo" in
              https://github.com/leidarljos/*.git) ;;
              *) echo "sibling-pin:${line_no}: ${name} repository is not a leidarljos git url" >&2; exit 1 ;;
            esac
            # git names these objects with SHA-1: 40 hexadecimal digits.
            printf '%s' "$commit" | grep -Eq '^[0-9a-f]{40}$' || {
              echo "sibling-pin:${line_no}: ${name} commit is not a full SHA-1" >&2
              exit 1
            }
            case "$name" in
              vissue) pkg=vissue-cli ;;
              claimdag) pkg=claimdag-cli ;;
              deedar) pkg=deedar-cli ;;
              *) echo "sibling-pin:${line_no}: no package for ${name}" >&2; exit 1 ;;
            esac
            dir="${{ runner.temp }}/src-${name}"
            rm -rf "$dir"
            git init -q "$dir"
            git -C "$dir" remote add origin "$repo"
            git -C "$dir" fetch --depth 1 origin "$commit"
            git -C "$dir" checkout --detach FETCH_HEAD
            test "$(git -C "$dir" rev-parse HEAD)" = "$commit"
            cargo build --locked --manifest-path "$dir/Cargo.toml" -p "$pkg" --bin "$name"
            install -m 0755 "$dir/target/debug/$name" "$dest/$name"
          done < .github/sibling-pin
      - name: Sibling tools on PATH
        run: |
          set -euo pipefail
          dest="${{ runner.temp }}/sibling-bin"
          echo "$dest" >> "$GITHUB_PATH"
          export PATH="$dest:${PATH}"
          line_no=0
          while IFS= read -r line || [ -n "$line" ]; do
            line_no=$((line_no + 1))
            trim=$(printf '%s' "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            case "$trim" in
              ''|\#*) continue ;;
            esac
            set -- $trim
            name=$1
            version=$4
            test -x "$dest/$name"
            # The first line only. A pipe into `head` can SIGPIPE a tool
            # that writes more, and `pipefail` would then fail a good pin.
            got=$("$dest/$name" --version)
            got=${got%%$'\n'*}
            want="$name $version"
            if [ "$got" != "$want" ]; then
              echo "sibling-pin:${line_no}: ${name} --version printed '${got}', pin says '${want}'" >&2
              exit 1
            fi
          done < .github/sibling-pin
      # The guard tests ask the real ljos-policyd about a shell line, so
      # they run a released build, phronesis linked. The commit is pinned,
      # as for the other tools, so a policyd change reaches these tests
      # only with an ljos commit. The pin is the v0.7.0 tag.
      - name: Build ljos-policyd at the pinned commit with phronesis
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends meson ninja-build capnproto pkg-config
          # phronesis keeps no release tags, so the commit is pinned, as
          # for the other companion tools.
          sha=7d115de79407a54e0be5050f95107cfa08fe6277
          git init -q "${{ runner.temp }}/phronesis"
          cd "${{ runner.temp }}/phronesis"
          git remote add origin https://github.com/leidarljos/phronesis.git
          git fetch --depth 1 origin "$sha"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$sha"
          meson setup build --prefix="${{ runner.temp }}/phronesis-prefix" -Dtests=disabled
          meson compile -C build
          meson install -C build
          cd "$GITHUB_WORKSPACE"
          sha=233639176f497444068e7b92526fe8556528a9a9
          dir="${{ runner.temp }}/ljos-policyd"
          git init -q "$dir"
          git -C "$dir" remote add origin https://github.com/leidarljos/ljos-policyd.git
          git -C "$dir" fetch --depth 1 origin "$sha"
          git -C "$dir" checkout --detach FETCH_HEAD
          test "$(git -C "$dir" rev-parse HEAD)" = "$sha"
          PHRONESIS_DIR="${{ runner.temp }}/phronesis-prefix" cargo build --locked --release --manifest-path "$dir/Cargo.toml"
          mkdir -p "${{ runner.temp }}/bin"
          install -m 0755 "$dir/target/release/ljos-policyd" "${{ runner.temp }}/bin/ljos-policyd"
          echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"
          "${{ runner.temp }}/bin/ljos-policyd" version | grep -q '(phronesis)'
      # A test that runs git in this checkout writes its .git/config, and
      # the next commit here runs hooks from a temp home that is gone.
      # Without --no-fail-fast one failing lib test stopped cargo before
      # any tests/*.rs ran (run 41565021207).
      - name: Workspace tests
        run: |
          set -euo pipefail
          git config --local --list > "${{ runner.temp }}/git-config-before"
          cargo test --workspace --no-fail-fast
          git config --local --list > "${{ runner.temp }}/git-config-after"
          diff -u "${{ runner.temp }}/git-config-before" "${{ runner.temp }}/git-config-after"
      - name: MCP tool list size
        run: |
          set -euo pipefail
          python3 -m venv "${{ runner.temp }}/tok"
          "${{ runner.temp }}/tok/bin/pip" install --disable-pip-version-check 'tiktoken==0.12.0'
          PATH="${{ runner.temp }}/tok/bin:${PATH}" scripts/mcp-size.sh --check
      # The samples in the docs are this binary's doctor, version and help.
      # A committed block that was typed by hand, or that a command no longer
      # prints, fails the diff.
      - name: Doc samples
        run: |
          set -euo pipefail
          python3 docs/scripts/gen_samples.py
          git diff --exit-code

  # A push that passed the tests keeps a bookworm build for fourteen days.
  # The cargo line is the linux line from release.yml. Debian 12 is the
  # glibc baseline, so the binaries run where that release runs. Nothing
  # here tags a commit or publishes a release.
  linux-archive:
    name: linux archive
    needs: test
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the bookworm archive
        run: docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src debian:bookworm bash /src/scripts/bookworm-archive.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ljos-${{ github.sha }}-x86_64-linux
          path: |
            dist/ljos-${{ github.sha }}-x86_64-linux.tar.gz
            dist/ljos-${{ github.sha }}-x86_64-linux.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error

  macos:
    name: cargo check and test on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin, x86_64-apple-darwin
          components: clippy
      # The pin in rust-toolchain.toml is the compiler cargo runs.
      # Targets on the action's toolchain do not reach that pin.
      - name: The pinned cross target
        run: |
          set -eu
          rustup target add x86_64-apple-darwin
          rustup target list --installed | grep -qx x86_64-apple-darwin
      - name: Check aarch64-apple-darwin
        run: cargo check --locked --workspace --all-targets --keep-going --target aarch64-apple-darwin
      - name: Check x86_64-apple-darwin
        run: cargo check --locked --workspace --all-targets --keep-going --target x86_64-apple-darwin
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --keep-going -- -D warnings
      # The sync, rules and push tests seal with age, as on the Linux job.
      - name: age
        run: |
          set -eu
          brew install age
          command -v age-keygen
      - name: Unit tests
        run: cargo test --locked --workspace --lib --no-fail-fast

  # release.yml already builds on macos-latest. This job runs the
  # parent-death and launcher tests there, which is the kqueue path.
  # Those tests use a fake pack and do not need packsetd.
  mcp-lifetime-macos:
    name: mcp lifetime on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: MCP lifetime
        run: cargo test -p ljos --test mcp_lifetime --no-fail-fast

  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.89.0
      # Built from source, so the job pulls no image from Docker Hub.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: deny
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}-${{ runner.arch }}
      - name: Build cargo-deny 0.20.2 from source
        if: steps.deny.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: cargo deny check
        run: cargo deny check
