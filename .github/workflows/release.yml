name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # Builds the release for a tag that already exists, with this workflow and
  # the tag's own source. The tag is not moved.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, such as v0.28.0"
        required: true
        type: string

permissions:
  contents: write
  # The build attestations: a signed statement that this workflow built
  # each archive, which `gh attestation verify` and install.sh check.
  id-token: write
  attestations: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - name: The tag names a release
        run: |
          set -eu
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      # rust-toolchain.toml pins the compiler, and cargo builds with the pin
      # whatever the action sets as default. The target goes on the pin.
      - name: The pinned toolchain
        id: pin
        run: |
          set -eu
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          targets: ${{ matrix.target }}
      - name: The target is installed for the pin
        run: rustup target list --installed | grep -qx '${{ matrix.target }}'
      # ljos-hud links libwayland-client through pkg-config.
      - name: Build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev
      # rustc 1.89.0 takes SIGSEGV in LLVM BranchProbabilityInfo::calculate
      # while optimizing packset-core at opt-level 3 for aarch64. The
      # faulting instruction loads through a null register, and raising
      # RUST_MIN_STACK still crashes. The same crate compiles at opt-level 2.
      - name: Build
        run: |
          set -eu
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_PROFILE_RELEASE_OPT_LEVEL=2
          fi
          # Cargo 1.89 does not expand ${PWD} in .cargo/config.toml.
          # A local release build exports the same two remaps: the
          # checkout mapped to /src, and CARGO_HOME mapped to /cargo.
          # CARGO_HOME is pinned so the registry path matches a build
          # on another machine. RUSTFLAGS replaces this list.
          if [ -z "${SOURCE_DATE_EPOCH:-}" ]; then
            SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
            export SOURCE_DATE_EPOCH
          fi
          export CARGO_INCREMENTAL=0
          export CARGO_HOME=/usr/local/cargo
          if [ ! -w "$CARGO_HOME" ]; then
            sudo mkdir -p "$CARGO_HOME"
            sudo chown "$(id -u):$(id -g)" "$CARGO_HOME"
          fi
          mkdir -p "$CARGO_HOME"
          export CARGO_BUILD_RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=/src --remap-path-prefix=${CARGO_HOME}=/cargo"
          cargo build --locked --release --target "${{ matrix.target }}" -p ljos -p ljos-hud
      - run: |
          set -eu
          name="ljos-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/ljos target/${{ matrix.target }}/release/ljos-mcp target/${{ matrix.target }}/release/ljos-hud "dist/$name/"
          cp README.md CHANGELOG.md LICENSE* "dist/$name/" 2>/dev/null || true
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*
  # The dense encoder for cloud VMs: ONNX Runtime built here from source
  # and packset-embed linked to it, which `ljos cloud up` installs on a
  # cloud VM only. The job reads no ljos source, so a run by hand for an
  # older tag builds the same pair.
  encoder:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
          - os: macos-latest
            triple: aarch64-apple-darwin
            osx_arch: arm64
          - os: macos-latest
            triple: x86_64-apple-darwin
            osx_arch: x86_64
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.triple }}
      ORT_VERSION: 1.28.3
      PACKSET_EMBED_VERSION: 0.17.0
    steps:
      # packset pins 1.89.0 in rust-toolchain.toml at v0.17.0.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.89.0
          targets: ${{ matrix.triple }}
      # ONNX Runtime 1.28.3 vendors protobuf 21.12, so protoc has to be
      # that release: Debian's protobuf-compiler 3.21.12, which Ubuntu
      # 24.04 carries. cdn.pyke.io resolves to nothing, so a build that
      # reaches for the prebuilt runtime fails.
      - name: Build tools
        run: |
          set -eu
          if [ "${RUNNER_OS}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential cmake python3 protobuf-compiler pkg-config libssl-dev
            protoc=/usr/bin/protoc
          else
            curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
              https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-osx-universal_binary.zip
            echo "1acab3d1f774d120d5a38bccb78fd379d35226b254dc258978bc45593478ca4c  $RUNNER_TEMP/protoc.zip" | shasum -a 256 -c -
            unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
            protoc="$RUNNER_TEMP/protoc/bin/protoc"
          fi
          test "$("$protoc" --version)" = "libprotoc 3.21.12"
          echo "PROTOC=$protoc" >> "$GITHUB_ENV"
          echo "0.0.0.0 cdn.pyke.io" | sudo tee -a /etc/hosts
      # A release builds ONNX Runtime from source. A cache saved on another
      # ref would ship that build, so a tag and a run by hand do not restore
      # it. Other runs still save the build for a rerun.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: ort
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        with:
          path: ${{ runner.temp }}/onnxruntime
          key: onnxruntime-${{ env.ORT_VERSION }}-shared-telemetry-off-protoc-3.21.12-${{ env.TARGET }}
      - name: Build ONNX Runtime from source
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || steps.ort.outputs.cache-hit != 'true'
        run: |
          set -eu
          src="$RUNNER_TEMP/onnxruntime-src"
          prefix="$RUNNER_TEMP/onnxruntime"
          git clone --quiet --depth 1 --branch "v$ORT_VERSION" https://github.com/microsoft/onnxruntime "$src"
          cd "$src"
          if [ "${RUNNER_OS}" = "macOS" ]; then
            ./build.sh --config Release --build_shared_lib --parallel --skip_tests \
              --compile_no_warning_as_error --skip_submodule_sync \
              --osx_arch "${{ matrix.osx_arch }}" \
              --cmake_extra_defines "CMAKE_INSTALL_PREFIX=$prefix" \
                onnxruntime_BUILD_UNIT_TESTS=OFF onnxruntime_USE_TELEMETRY=OFF \
                "ONNX_CUSTOM_PROTOC_EXECUTABLE=$PROTOC"
            grep -qx 'onnxruntime_USE_TELEMETRY:BOOL=OFF' build/MacOS/Release/CMakeCache.txt
            grep -Eqx "ONNX_CUSTOM_PROTOC_EXECUTABLE:[A-Z]+=$PROTOC" build/MacOS/Release/CMakeCache.txt
            cmake --install build/MacOS/Release
          else
            export CC=gcc CXX=g++
            ./build.sh --config Release --build_shared_lib --parallel --skip_tests \
              --compile_no_warning_as_error --skip_submodule_sync \
              --cmake_extra_defines "CMAKE_INSTALL_PREFIX=$prefix" \
                onnxruntime_BUILD_UNIT_TESTS=OFF onnxruntime_USE_TELEMETRY=OFF \
                "ONNX_CUSTOM_PROTOC_EXECUTABLE=$PROTOC"
            grep -qx 'onnxruntime_USE_TELEMETRY:BOOL=OFF' build/Linux/Release/CMakeCache.txt
            grep -Eqx "ONNX_CUSTOM_PROTOC_EXECUTABLE:[A-Z]+=$PROTOC" build/Linux/Release/CMakeCache.txt
            cmake --install build/Linux/Release
          fi
          cp LICENSE ThirdPartyNotices.txt "$prefix/"
      # ort links the shared library in ORT_LIB_PATH and downloads nothing.
      # pkg-config stays out, so no other libonnxruntime can win. The rpath
      # finds the library in ../lib/onnxruntime beside the binary.
      - name: Build packset-embed against it
        env:
          ORT_LIB_PATH: ${{ runner.temp }}/onnxruntime/lib
          ORT_PREFER_DYNAMIC_LINK: "1"
          ORT_SKIP_DOWNLOAD: "1"
          LIBONNXRUNTIME_NO_PKG_CONFIG: "1"
        run: |
          set -eu
          if [ "${RUNNER_OS}" = "macOS" ]; then
            export RUSTFLAGS="-C link-arg=-Wl,-rpath,@loader_path/../lib/onnxruntime"
          else
            export RUSTFLAGS="-C link-arg=-Wl,-rpath,\$ORIGIN/../lib/onnxruntime"
          fi
          log="$RUNNER_TEMP/embed-build.log"
          if ! cargo install --locked -vv --target "$TARGET" --root "$RUNNER_TEMP/embed" \
              --version "$PACKSET_EMBED_VERSION" packset-embed > "$log" 2>&1; then
            tail -n 200 "$log"
            exit 1
          fi
          if grep -q 'cdn.pyke.io' "$log"; then
            echo "the packset-embed build reached for cdn.pyke.io" >&2
            exit 1
          fi
      # Each archive unpacks into a prefix such as ~/.local. Unpacked side by
      # side, the encoder starts with the archive's library and no other.
      # cloud up refuses a symlink, so the soname is copied as a regular file.
      # cmake install leaves it as a link beside the versioned library.
      - name: Package
        run: |
          set -eu
          rt="onnxruntime-$TARGET"
          embed="packset-embed-$TARGET"
          mkdir -p "dist/$rt/lib/onnxruntime" "dist/$embed/bin"
          if [ "${RUNNER_OS}" = "macOS" ]; then
            cp -L "$RUNNER_TEMP/onnxruntime/lib/libonnxruntime.1.dylib" "dist/$rt/lib/onnxruntime/"
            find "$RUNNER_TEMP/onnxruntime/lib" -type f -name 'libonnxruntime*.dylib' -exec cp {} "dist/$rt/lib/onnxruntime/" \;
          else
            cp -L "$RUNNER_TEMP/onnxruntime/lib/libonnxruntime.so.1" "dist/$rt/lib/onnxruntime/"
            find "$RUNNER_TEMP/onnxruntime/lib" -type f -name 'libonnxruntime.so*' -exec cp {} "dist/$rt/lib/onnxruntime/" \;
          fi
          cp "$RUNNER_TEMP/onnxruntime/LICENSE" "$RUNNER_TEMP/onnxruntime/ThirdPartyNotices.txt" "dist/$rt/lib/onnxruntime/"
          cp "$RUNNER_TEMP/embed/bin/packset-embed" "dist/$embed/bin/"
          tar -C "dist/$rt" -czf "dist/$rt.tar.gz" lib
          tar -C "dist/$embed" -czf "dist/$embed.tar.gz" bin
          check="$RUNNER_TEMP/check"
          mkdir -p "$check"
          tar -C "$check" -xzf "dist/$rt.tar.gz"
          tar -C "$check" -xzf "dist/$embed.tar.gz"
          if [ "${RUNNER_OS}" = "macOS" ]; then
            otool -l "$check/bin/packset-embed" | grep -F "@loader_path/../lib/onnxruntime"
            otool -L "$check/bin/packset-embed" | grep -F "libonnxruntime.1.dylib"
            if [ "$TARGET" = "aarch64-apple-darwin" ]; then
              "$check/bin/packset-embed" --help > /dev/null
            fi
          else
            readelf -d "$check/bin/packset-embed" | grep -F "[\$ORIGIN/../lib/onnxruntime]"
            ldd "$check/bin/packset-embed" | grep -F "$check/bin/../lib/onnxruntime/libonnxruntime.so.1 "
            "$check/bin/packset-embed" --help > /dev/null
          fi
          cd dist
          for f in "$rt.tar.gz" "$embed.tar.gz"; do
            sha256sum "$f" > "$f.sha256"
          done
          if [ "${RUNNER_OS}" = "macOS" ]; then
            sha256sum "$RUNNER_TEMP/onnxruntime/lib/libonnxruntime.1.dylib" >> "$rt.tar.gz.sha256"
          else
            sha256sum "$RUNNER_TEMP/onnxruntime/lib/libonnxruntime.so.1" >> "$rt.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: encoder-${{ env.TARGET }}
          path: dist/*.tar.gz*
          if-no-files-found: error
  release:
    needs: [build, encoder]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The installer goes up beside the archives, so
      # releases/latest/download/install.sh always names the latest one.
      - name: Attach the installer
        run: |
          cp scripts/install.sh dist/install.sh
          (cd dist && sha256sum install.sh > install.sh.sha256)
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/install.sh
      - name: Release notes from the changelog
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## "v {p=1; next} /^## /{if(p) exit} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      # A run by hand fills in the archives a release lacks and keeps the
      # ones already published, so their checksums stay as people saw them.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          body_path: notes.md
          files: dist/*
          overwrite_files: ${{ github.event_name != 'workflow_dispatch' }}
