name: docs

on:
  push:
    branches: ['**']
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths: ["docs/**", ".github/workflows/docs.yml", ".github/render-og-png.sh", ".impeccable/**"]
  # A pull request builds the docs and checks them; it never publishes.
  pull_request:
    branches: [main, develop]
    paths: ["docs/**", ".github/workflows/docs.yml", ".github/render-og-png.sh", ".impeccable/**"]
  workflow_dispatch:

permissions:
  contents: read

# Develop builds the docs and does not publish them. Main publishes on its
# push. A release tag builds and checks the docs here. docs-deploy.yml
# publishes that tag: the github-pages environment allows main only, and a
# workflow_run on the default branch checks out the tagged commit.
# A group holds one running and one pending run, and a newer pending run
# cancels the older one even with cancel-in-progress off. So each develop
# and main push has a group of its own, keyed by its sha, and runs to the
# end. Any other ref keeps one group, where a new push cancels the last.
# The deploy job shares `pages` with docs-deploy.yml, so two deploys never
# overlap and a running one is never cancelled.
concurrency:
  group: docs-${{ github.ref }}-${{ (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && github.sha || 'tip' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

jobs:
  build:
    permissions:
      contents: read
      pages: write
      id-token: write
    # The resolute runner cannot resolve the Ubuntu archive.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y --no-install-recommends pandoc
      - run: bash docs/scripts/export_org_to_rst.sh
      - run: python -m pip install -q -r docs/requirements.txt
      - run: sphinx-build -b html -n -W docs/source docs/build
      - run: python3 docs/scripts/check_html_links.py docs/build
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          package-manager-cache: false
      # Exit 2 on any finding the .impeccable config does not ignore.
      - run: npx -y impeccable@4.5.2 detect docs/build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: github.ref == 'refs/heads/main'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.ref == 'refs/heads/main'
        with:
          path: docs/build
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
