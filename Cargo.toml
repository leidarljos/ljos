[workspace]
resolver = "2"
members = ["crates/ljos-cli", "crates/ljos-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/leidarljos/ljos"
homepage = "https://leidarljos.github.io"
description = "One seat CLI over cards, packset, deedar, vissue, claimdag, and policyd"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
packset-client = "0.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "7"
