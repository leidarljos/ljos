[workspace]
resolver = "2"
members = ["crates/ljos-cli", "crates/ljos-mcp"]

[workspace.package]
version = "0.10.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/leidarljos/ljos"
homepage = "https://leidarljos.github.io"
description = "One seat CLI over cards, packset, deedar, vissue, claimdag, and policyd"

[workspace.dependencies]
rmcp = { version = "3.2", features = ["server", "transport-io", "transport-async-rw", "macros"] }
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
packset-client = { git = "https://github.com/leidarljos/packset", version = "0.8.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
which = "7"
