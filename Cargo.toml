[workspace]
resolver = "2"
members = ["crates/ljos-cli", "crates/ljos-hud"]

[workspace.package]
version = "0.32.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/leidarljos/ljos"
homepage = "https://leidarljos.github.io"
description = "Memory, a work tracker and a shell-command gate for coding agents over MCP and hooks."

[workspace.dependencies]
rmcp = { version = "3.2", features = ["server", "transport-io", "transport-async-rw", "macros", "elicitation"] }
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal", "sync"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
packset-client = "0.15.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
which = "7"
vissue-core = "0.20"

[patch.crates-io]
# ureq 2.12.1's tls feature pulls webpki-roots 0.26.11, which RUSTSEC-2026-0381
# still flags. The patch depends on webpki-roots 1 instead.
ureq = { path = "vendor/ureq" }
# claimdag 0.7.1 depends on capnp 0.20 (RUSTSEC-2025-0143). This build uses
# capnp 0.27 and the same schema.
claimdag = { path = "vendor/claimdag" }

