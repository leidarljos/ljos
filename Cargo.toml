[workspace]
resolver = "2"
members = ["crates/ljos-cli", "crates/ljos-hud", "crates/ljos-test-boot"]

[workspace.package]
version = "0.35.6"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/leidarljos/ljos"
homepage = "https://leidarljos.github.io"
description = "Memory, a work tracker and a shell-command gate for coding agents over MCP and hooks."

[workspace.dependencies]
rmcp = { version = "3.2", features = ["server", "transport-io", "transport-async-rw", "macros", "elicitation"] }
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal", "sync", "time"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
packset-client = "0.16.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
which = "7"
vissue-core = "0.20"

# argon2id at the person-key cost (64 MiB, three passes, four lanes) runs
# seconds per hash unoptimised. Debug and test builds optimise the hash
# alone, so a prompt test answers in the time a person would wait.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
